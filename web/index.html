<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>FamilyCare Sync</title>

    <!-- PWA / iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FamilyCare" />
    <meta name="theme-color" content="#6B9E7A" />
    <meta name="description" content="Private family medical appointment coordination" />

    <!-- Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        document.body.style.cssText = 'background:#fff;padding:20px;font-family:monospace;overflow:auto';
        document.body.innerHTML = '<h2 style="color:red">JS Error</h2><b>' + msg + '</b><br/><br/>' + (err ? err.stack : '') + '<br/>Source: ' + src + ':' + line;
      };
      window.onunhandledrejection = function(e) {
        document.body.style.cssText = 'background:#fff;padding:20px;font-family:monospace;overflow:auto';
        document.body.innerHTML = '<h2 style="color:red">Unhandled Promise</h2>' + (e.reason ? (e.reason.stack || e.reason) : e);
      };
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
